[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24.19.0"
  NPM_VERSION = "10.2.0"
  NEXT_TELEMETRY_DISABLED = "1"

# Supabase values belong in the Netlify environment UI, never in this file.
# Netlify detects Next.js and installs its framework runtime automatically.
